global:
  clusterDomain: 'cluster.local'
gateway:
  enabled: true
minio:
  enabled: true
storage:
  trace:
    backend: s3
    s3:
      access_key: 'grafana-tempo'
      secret_key: 'supersecret'
      bucket: 'tempo-traces'
      endpoint: 'tempo-minio:9000'
      insecure: true
traces:
  otlp:
    http:
      enabled: true
    grpc:
      enabled: true
distributor:
  config:
    log_received_spans:
      enabled: true
    log_discarded_spans:
      enabled: true      
metaMonitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
    interval: 15s
    scrapeTimeout: 10s
metricsGenerator:
  enabled: true
  
  # НАСТРОЙКИ ДЛЯ STORAGE (ВАЖНО!)
  storage:
    path: /var/tempo/wal
    remote_write:
      - url: http://kube-prometheus-stack-prometheus.pronetheus.svc.cluster.local:9090/api/v1/write
        send_exemplars: true

  # ВКЛЮЧАЕМ НУЖНЫЙ ПРОЦЕССОР
  processor:
    local_blocks:
      filter_server_spans: false

# ГЛОБАЛЬНЫЕ НАСТРОЙКИ ДЛЯ ВСЕХ ТЕНАНТОВ (КЛЮЧЕВОЙ МОМЕНТ!)
overrides:
  defaults:
    metrics_generator:
      processors: ['local-blocks']
