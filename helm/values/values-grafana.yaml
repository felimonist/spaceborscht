env:
  GF_AUTH_ANONYMOUS_ENABLED: true
  GF_AUTH_ANONYMOUS_ORG_ROLE: 'Admin'
  GF_AUTH_DISABLE_LOGIN_FORM: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: metrics
        type: prometheus
        access: proxy
        url: http://kube-prometheus-stack-prometheus.prometheus.svc.cluster.local:9090
        basicAuth: false
        isDefault: true
        editable: false

      - name: Loki
        uid: logs
        type: loki
        access: proxy
        url: http://loki.loki.svc.cluster.local:3100
        basicAuth: false
        isDefault: false
        editable: false
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "otel"

      - name: Tempo
        uid: traces
        type: tempo
        access: proxy
        url: http://tempo-query-frontend-discovery.tempo.svc.cluster.local:3200
        basicAuth: false
        isDefault: false
        editable: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: lesson
        orgId: 1
        folder: "lesson"
        type: file
        disableDeletion: false
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/lesson
      - name: service
        orgId: 1
        folder: "service"
        type: file
        disableDeletion: false
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/service
      - name: loki
        orgId: 1
        folder: "practice"
        type: file
        disableDeletion: true
        allowUiUpdates: true 
        options:
          path: /var/lib/grafana/dashboards/loki
      - name: tempo
        orgId: 1
        folder: "tempo"
        type: file
        disableDeletion: false
        allowUiUpdates: false 
        options:
          path: /var/lib/grafana/dashboards/tempo
